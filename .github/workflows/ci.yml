name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax
        run: |
          node --check .opencode/plugins/index.js
          node --check packages/opencode/src/index.js
          node --check packages/opencode/src/parallel.js
          node --check packages/opencode/bin/install.js
          node --check packages/codex/src/setup.js
          node --check packages/codex/bin/install.js
          node --check packages/core/hooks/python-env.js
          node --check packages/core/hooks/project-venv.js
          node --check packages/core/hooks/setup-venv.js
          node --check packages/core/scripts/pack-superpowers.js
          node --check packages/core/src/paths.js
          node --check packages/core/src/skills/catalog.js
          node --check packages/core/src/skills/render.js

      - name: Validate Codex plugin templates
        run: |
            node -e "JSON.parse(require('fs').readFileSync('packages/core/mcp-servers/base.json','utf8'))"

      - name: Check Python scripts
        run: |
          python3 -m py_compile packages/core/skills/deep-research/scripts/*.py
          python3 -m py_compile packages/core/skills/_shared/scripts/loop_engine.py

      - name: Prepare isolated Python test environment
        run: |
          python3 -m venv .omagents/ci-venv
          .omagents/ci-venv/bin/python -m pip install jinja2

      - name: Check formatting
        run: npx prettier --check ".opencode/plugins/*.js" "packages/core/src/*.js" "packages/core/src/*/*.js" "packages/core/hooks/*.js" "packages/core/scripts/*.js" "packages/opencode/src/*.js" "packages/opencode/bin/*.js" "packages/codex/src/*.js" "packages/codex/bin/*.js" "packages/codex/test/*.js" "tests/*.js"

      - name: Run tests
        env:
          OMAGENTS_TEST_PYTHON: .omagents/ci-venv/bin/python
        run: node --test packages/codex/test/*.test.js tests/*.test.js packages/core/test/*.test.js
