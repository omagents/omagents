name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: Unit and packed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            python-bin: ${{ github.workspace }}/.omagents/ci-venv/bin/python
          - os: macos-latest
            python-bin: ${{ github.workspace }}/.omagents/ci-venv/bin/python
          - os: windows-latest
            python-bin: ${{ github.workspace }}/.omagents/ci-venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax
        run: |
          node --check .opencode/plugins/index.js
          node --check packages/opencode/src/index.js
          node --check packages/opencode/src/parallel.js
          node --check packages/opencode/bin/install.js
          node --check packages/codex/src/setup.js
          node --check packages/codex/bin/install.js
          node --check packages/core/hooks/python-env.js
          node --check packages/core/hooks/project-venv.js
          node --check packages/core/hooks/setup-venv.js
          node --check packages/core/scripts/pack-superpowers.js
          node --check packages/core/src/paths.js
          node --check packages/core/src/skills/catalog.js
          node --check packages/core/src/skills/render.js
          node --check scripts/pack-all.js
          node --check scripts/packed-harness.js
          node --check scripts/test-packed-installs.js
          node --check scripts/test-browser.js
          node --check scripts/prepare-browser-clean-room.js

      - name: Validate Codex plugin templates
        run: node -e "JSON.parse(require('fs').readFileSync('packages/core/mcp-servers/base.json','utf8'))"

      - name: Check Python scripts
        run: |
          python -m py_compile packages/core/skills/deep-research/scripts/*.py
          python -m py_compile packages/core/skills/_shared/scripts/loop_engine.py

      - name: Prepare isolated Python test environment
        run: |
          python -m venv .omagents/ci-venv
          ${{ matrix.python-bin }} -m pip install jinja2

      - name: Check formatting
        run: npx prettier --check ".opencode/plugins/*.js" "packages/core/src/*.js" "packages/core/src/*/*.js" "packages/core/hooks/*.js" "packages/core/scripts/*.js" "packages/opencode/src/*.js" "packages/opencode/bin/*.js" "packages/codex/src/*.js" "packages/codex/bin/*.js" "packages/codex/test/*.js" "tests/*.js" "scripts/*.js"

      - name: Run unit and workspace tests
        env:
          OMAGENTS_TEST_PYTHON: ${{ matrix.python-bin }}
        run: npm test

      - name: Run clean-room tarball verification
        run: npm run test:packed

  browser:
    name: DSH Web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            playwright-deps: '1'
          - os: macos-latest
            playwright-deps: '0'
          - os: windows-latest
            playwright-deps: '0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install packed DSH offline
        run: npm run test:packed

      - name: Run real DSH browser verification
        env:
          OMAGENTS_PLAYWRIGHT_WITH_DEPS: ${{ matrix.playwright-deps }}
        run: npm run test:browser
