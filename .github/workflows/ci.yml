name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax
        run: |
          node --check .opencode/plugins/index.js
          node --check .opencode/plugins/parallel.js
          node --check setup/opencode.js
          node --check index.js
          node --check .codex/plugins/setup.js
          node --check hooks/python-env.js
          node --check hooks/project-venv.js
          node --check hooks/setup-venv.js

      - name: Validate Codex plugin templates
        run: |
            node -e "JSON.parse(require('fs').readFileSync('mcp-servers/base.json','utf8'))"

      - name: Check Python scripts
        run: |
          python3 -m py_compile skills/deep-research/scripts/*.py
          python3 -m py_compile skills/_shared/scripts/loop_engine.py

      - name: Prepare isolated Python test environment
        run: |
          python3 -m venv .omagents/ci-venv
          .omagents/ci-venv/bin/python -m pip install jinja2

      - name: Check formatting
        run: npx prettier --check ".opencode/plugins/*.js" "tests/*.js" "index.js" ".codex/plugins/*.js" "hooks/*.js"

      - name: Run tests
        env:
          OMAGENTS_TEST_PYTHON: .omagents/ci-venv/bin/python
        run: node --test tests/*.test.js
