name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships with npm >= 11.5.1, which supports OIDC trusted publishing.
          node-version: "24"
          package-manager-cache: false

      - run: npm ci

      - name: Verify and publish the aligned four-package release
        run: node scripts/publish-all.js --execute
