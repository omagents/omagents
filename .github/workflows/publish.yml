name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships with npm >= 11.5.1, which supports OIDC trusted publishing.
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Prepare isolated Python test environment
        run: |
          python -m venv .omagents/ci-venv
          ${{ github.workspace }}/.omagents/ci-venv/bin/python -m pip install jinja2

      - name: Verify and publish the aligned four-package release
        env:
          OMAGENTS_TEST_PYTHON: ${{ github.workspace }}/.omagents/ci-venv/bin/python
          OMAGENTS_PLAYWRIGHT_WITH_DEPS: "1"
        run: node scripts/publish-all.js --execute

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          else
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; skipping."
          fi
